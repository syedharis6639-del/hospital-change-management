{% extends "layout.html" %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <div style="margin-bottom: 2rem;">
        <h2 style="font-size: 1.875rem; font-weight: 700; color: white; margin: 0;">Register New Patient</h2>
        <p style="color: var(--color-text-muted); margin: 0.5rem 0 0 0;">Enter the legal records for a new patient entry.</p>
    </div>

    {% if error %}
        <div class="alert alert-danger" style="margin-bottom: 2rem;">
            {{ error }}
        </div>
    {% endif %}

    <div class="panel">
        <form action="{{ url_for('add_patient') }}" method="POST" style="padding: 2rem; display: flex; flex-direction: column; gap: 1.5rem;">
            <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 1rem;">
                <div class="form-group">
                    <label>Manual ID (Optional)</label>
                    <input type="number" name="id" class="form-input" placeholder="Auto-assign">
                </div>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="name" class="form-input" required placeholder="Patient Legal Name">
                </div>
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 1rem;">
                <div class="form-group">
                    <label>Age</label>
                    <input type="number" name="age" class="form-input" required placeholder="00">
                </div>
                <div class="form-group">
                    <label>Diagnosis</label>
                    <input type="text" name="diagnosis" class="form-input" required placeholder="Initial Assessment">
                </div>
            </div>

            <div class="form-group">
                <label>Patient Status (Tag)</label>
                <select name="status" class="form-input" style="border-color: var(--color-border-color);">
                    <option value="Stable" selected>Stable (Routine Guard)</option>
                    <option value="Critical">Critical (High Alert)</option>
                    <option value="ICU">ICU (Intensive Care)</option>
                    <option value="Discharged">Discharged (Archive Ready)</option>
                </select>
                <p style="font-size: 10px; color: var(--color-text-muted); margin-top: 0.5rem;">Affects visual priority and record tracking across the system.</p>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 1rem; border-top: 1px solid var(--color-border-color); padding-top: 1.5rem; margin-top: 0.5rem;">
                <a href="{{ url_for('dashboard') }}" class="btn" style="color: var(--color-text-muted);">Cancel</a>
                <button type="submit" class="btn btn-primary">
                    <i data-lucide="plus" style="width: 16px; height: 16px;"></i>
                    Register Patient
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
